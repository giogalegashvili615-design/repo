name: FitX
options:
  bundleIdPrefix: com.fitx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FitX:
    type: application
    platform: iOS
    sources:
      - path: FitX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitx.app
        INFOPLIST_FILE: FitX/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
