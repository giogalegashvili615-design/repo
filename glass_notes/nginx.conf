server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/png png;
        image/svg+xml svg;
        application/vnd.android.package-archive apk;
    }

    # Previous deliverable (Cluck & Dash 3D) kept downloadable next to the current build.
    location = /cluck_and_dash.apk {
        alias /srv/cluck/cluck_and_dash.apk;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
