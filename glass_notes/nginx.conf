server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/png png;
        image/svg+xml svg;
        application/vnd.android.package-archive apk;
    }

    # Assistant app site (download + pricing) is the landing page.
    location = / {
        root /srv/site;
        try_files /index.html =404;
    }

    # Subscription checkout lives in the `payments` service.
    location /api/ {
        proxy_pass http://payments:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Previous deliverables kept downloadable next to the current build.
    location = /cluck_and_dash.apk {
        alias /srv/cluck/cluck_and_dash.apk;
    }

    location = /assistant.apk {
        alias /srv/assistant/assistant.apk;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
