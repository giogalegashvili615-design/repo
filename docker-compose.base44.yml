services:
  # Serves the gallery page itself on / and the signed APK on /glass_gallery.apk.
  # The page is mounted straight from the Android asset directory, so the APK
  # and the preview are always the same file.
  web:
    image: nginx:alpine
    labels:
      base44.project: "Glass Gallery"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      - ./glass_gallery/app/src/main/assets:/usr/share/nginx/html:ro
      - ./glass_gallery/dist:/srv/dl:ro
      - ./glass_gallery/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
