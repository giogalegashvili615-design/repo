services:
  web:
    image: nginx:alpine
    labels:
      base44.project: "Cluck & Dash 3D build"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      - ./cluck_and_dash/dist:/usr/share/nginx/html:ro
      - ./cluck_and_dash/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
