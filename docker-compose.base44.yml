services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    volumes:
      - ./:/app:cached
      - cloud_ai_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  cloud_ai_node_modules:
