<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Glass Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky large-title header, photo grid under it, floating glass tab bar at the bottom, full-screen viewer on top. */
:root{
  --bg:#ffffff;
  --fg:#0c0c10;
  --fg2:#6b6b74;
  --tile:#e8e8ee;
  --glass:rgba(255,255,255,.66);
  --glass-brd:rgba(0,0,0,.07);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.95);
  --shadow:0 8px 28px rgba(20,20,50,.13);
  --accent:#0a7cff;
  --heart:#ff2d55;
  --danger:#ff3b30;
  --scrim:rgba(0,0,0,.32);
  --seg-on:#ffffff;
  --sheet:rgba(250,250,253,.86);
  --sel:rgba(10,124,255,.30);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;
    --fg:#f5f5f7;
    --fg2:#9a9aa2;
    --tile:#1b1b1f;
    --glass:rgba(48,48,54,.58);
    --glass-brd:rgba(255,255,255,.14);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.18);
    --shadow:0 10px 34px rgba(0,0,0,.6);
    --accent:#3d98ff;
    --heart:#ff4f75;
    --danger:#ff5b52;
    --scrim:rgba(0,0,0,.58);
    --seg-on:#6a6a70;
    --sheet:rgba(36,36,40,.86);
    --sel:rgba(61,152,255,.34);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;
  --fg:#f5f5f7;
  --fg2:#9a9aa2;
  --tile:#1b1b1f;
  --glass:rgba(48,48,54,.58);
  --glass-brd:rgba(255,255,255,.14);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.18);
  --shadow:0 10px 34px rgba(0,0,0,.6);
  --accent:#3d98ff;
  --heart:#ff4f75;
  --danger:#ff5b52;
  --scrim:rgba(0,0,0,.58);
  --seg-on:#6a6a70;
  --sheet:rgba(36,36,40,.86);
  --sel:rgba(61,152,255,.34);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 150px;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid var(--glass-brd);
  box-shadow:var(--glass-hi),var(--shadow);
}
.pill{height:40px;padding:0 16px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}

header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;
  background:linear-gradient(var(--bg) 80%,transparent);
  padding-block:10px 16px;
}
.top-row{display:flex;align-items:center;gap:10px;min-height:44px}
h1{flex:1;min-width:0;margin:0;font-size:2rem;line-height:1.1;font-weight:800;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.actions{display:flex;gap:8px;align-items:center;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:999px;margin-top:12px;max-width:360px}
.seg button{height:34px;border-radius:999px;text-align:center;font-size:14px;font-weight:600;color:var(--fg2)}
.seg button[aria-selected="true"]{background:var(--seg-on);color:var(--fg);box-shadow:0 1px 5px rgba(0,0,0,.18)}

.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:3px}
.grp{margin-bottom:22px}
.grp h2{display:flex;align-items:baseline;gap:8px;margin:6px 2px 8px;font-size:1.15rem;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.grp h2 span{font-size:.8rem;font-weight:500;color:var(--fg2);font-variant-numeric:tabular-nums}
.tile{position:relative;display:block;width:100%;aspect-ratio:1;background:var(--tile);border-radius:6px;overflow:hidden;padding:0}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;font-size:10px;line-height:1.2;color:var(--fg2);text-align:center;overflow:hidden;word-break:break-all}
.tile.broken img,.tile.broken video{display:none}
.tile.broken .fallback{display:flex}
.badge{position:absolute;bottom:5px;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);font-variant-numeric:tabular-nums}
.badge.l{left:6px}
.badge.r{right:6px}
.badge.heart svg{width:14px;height:14px}
.badge.r svg{width:11px;height:11px}
.check{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);display:none;place-items:center;color:#fff}
.check svg{width:14px;height:14px;opacity:0}
.selecting .check{display:grid}
.selecting .badge.r{right:34px}
.tile.sel::after{content:"";position:absolute;inset:0;background:var(--sel)}
.tile.sel .check{background:var(--accent);border-color:#fff;z-index:2}
.tile.sel .check svg{opacity:1}
.foot{text-align:center;color:var(--fg2);font-size:.95rem;margin:22px 0 0;font-variant-numeric:tabular-nums}
.hint{text-align:center;color:var(--fg2);margin:48px 0}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:640px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:2px;min-width:0}
.cover{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--tile);color:var(--fg2);margin-bottom:6px}
.cover img,.cover video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cname{font-weight:600;font-size:1rem}
.ccount{color:var(--fg2);font-size:.9rem;font-variant-numeric:tabular-nums}

.searchbox{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:999px;margin-bottom:18px;color:var(--fg2)}
.searchbox input{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--fg)}
.searchbox input::placeholder{color:var(--fg2)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:36px 0 20px}
.empty h2{margin:12px 0 0;font-size:1.5rem;letter-spacing:-.02em;text-wrap:balance}
.empty p{margin:0;max-width:34ch;color:var(--fg2);text-wrap:pretty}
.empty .small{font-size:.85rem}
.stack{position:relative;width:170px;height:150px;margin-bottom:6px}
.stack i{position:absolute;width:96px;height:120px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.stack i:nth-child(1){left:8px;top:18px;transform:rotate(-10deg);background:linear-gradient(160deg,#ffb36b,#e0457b)}
.stack i:nth-child(2){left:62px;top:14px;transform:rotate(9deg);background:linear-gradient(160deg,#6fd3ff,#3b5bdb)}
.stack i:nth-child(3){left:35px;top:4px;background:linear-gradient(160deg,#9be68a,#1c8f6b)}
.cta{height:48px;padding:0 26px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;margin-top:8px}
.link{color:var(--accent);font-weight:600;padding:8px 12px}

nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;justify-content:center;gap:10px;pointer-events:none;
  padding-top:0;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:barIn .52s cubic-bezier(.22,1.16,.36,1) both;
}
nav.tabbar>*{pointer-events:auto}
.tabs{position:relative;display:flex;gap:2px;padding:5px;border-radius:999px;overflow:hidden}
.tabs::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 22%,rgba(255,255,255,.5) 45%,transparent 64%);
  background-size:240% 100%;background-position:130% 0;opacity:.55;
  animation:sheen 6s ease-in-out 1.4s infinite;
}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:86px;padding:7px 18px;border-radius:999px;font-size:11px;font-weight:600;color:var(--fg2);text-align:center;transition:color .24s ease}
.tab svg{transition:transform .22s ease}
.tab:active svg{transform:scale(.84)}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] svg{animation:tabPop .54s cubic-bezier(.3,1.6,.45,1)}
.tab[aria-selected="true"] span{animation:labelUp .4s cubic-bezier(.3,1.5,.5,1)}
.tab.danger{color:var(--danger)}
/* the highlight that springs from one tab to the other */
.pillfx{
  position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;z-index:0;
  background:color-mix(in srgb,var(--fg) 9%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px -10px color-mix(in srgb,var(--accent) 70%,transparent);
  opacity:0;pointer-events:none;will-change:transform,width;
  transition:transform .46s cubic-bezier(.3,1.5,.5,1),width .46s cubic-bezier(.3,1.5,.5,1),opacity .2s ease;
}
.big{position:relative;width:58px;height:58px;transition:color .24s ease,transform .34s cubic-bezier(.3,1.5,.5,1)}
.big:active{transform:scale(.9)}
.big svg{transition:transform .34s cubic-bezier(.3,1.5,.5,1)}
.big[aria-selected="true"]{color:var(--accent)}
.big[aria-selected="true"] svg{transform:scale(1.08);animation:tabPop .54s cubic-bezier(.3,1.6,.45,1)}
.big::after{content:"";position:absolute;inset:0;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);opacity:0;pointer-events:none}
.big[aria-selected="true"]::after{animation:halo 2.4s ease-out .1s infinite}
.tabs.pop,.tabbar .pop{animation:barPop .36s cubic-bezier(.3,1.45,.5,1)}
@keyframes barIn{from{transform:translateY(140%);opacity:0}to{transform:none;opacity:1}}
@keyframes barPop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
@keyframes tabPop{0%{transform:scale(.8) translateY(2px)}46%{transform:scale(1.2) translateY(-3px)}100%{transform:scale(1) translateY(0)}}
@keyframes labelUp{from{opacity:.35;transform:translateY(2px)}to{opacity:1;transform:none}}
@keyframes sheen{0%,55%{background-position:130% 0}100%{background-position:-90% 0}}
@keyframes halo{0%{opacity:.55;transform:scale(.86)}70%,100%{opacity:0;transform:scale(1.28)}}

.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{
  position:relative;width:min(100%,520px);margin:0 max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  border:1px solid var(--glass-brd);box-shadow:var(--glass-hi),var(--shadow);border-radius:32px;padding:8px;
  animation:rise .22s ease;
}
.sheet h3{margin:10px 14px 4px;font-size:1.05rem;word-break:break-word}
.sheet p.note{margin:6px 14px 10px;color:var(--fg2);font-size:.9rem}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border-radius:20px;font-weight:600}
.row:hover:not(:disabled){background:color-mix(in srgb,var(--fg) 7%,transparent)}
.row.danger{color:var(--danger)}
.row.cancel{justify-content:center;color:var(--accent)}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:10px 14px 6px}
dt{color:var(--fg2)}
dd{margin:0;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}

.viewer{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage .media{width:100%;height:100%;object-fit:contain;display:block;transition:transform .25s ease;will-change:transform;-webkit-user-drag:none}
.stage video.media{max-height:100%}
.from-r{animation:inR .28s ease}
.from-l{animation:inL .28s ease}
@keyframes inR{from{transform:translateX(48px);opacity:0}}
@keyframes inL{from{transform:translateX(-48px);opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.cant{max-width:30ch;text-align:center;color:var(--fg2);padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.vtop{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;transition:opacity .2s}
.vtitle{min-width:0;padding:6px 18px;border-radius:999px;text-align:center;font-size:13px;line-height:1.25}
.vtitle b{display:block;font-size:14px}
.vtitle span{color:var(--fg2);font-variant-numeric:tabular-nums}
.vbottom{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .2s}
.vbottom .bar{pointer-events:auto;display:flex;gap:4px;padding:5px;border-radius:999px}
.vbottom .bar button{width:56px;height:46px;border-radius:999px;display:grid;place-items:center;transition:transform .22s cubic-bezier(.3,1.5,.5,1),color .24s ease}
.vbottom .bar button:active{transform:scale(.88)}
.vbottom .bar button.on{color:var(--heart)}
.vbottom .bar button.on svg{animation:beat .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes beat{0%{transform:scale(.7)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
.viewer.hide-ui .vtop,.viewer.hide-ui .vbottom{opacity:0;pointer-events:none}
.navbtn{position:absolute;z-index:3;top:50%;transform:translateY(-50%);display:none}
.navbtn.prev{left:max(16px,env(safe-area-inset-left,0px))}
.navbtn.next{right:max(16px,env(safe-area-inset-right,0px))}
@media (hover:hover) and (pointer:fine){.navbtn{display:grid}.navbtn[hidden]{display:none}}

.toast{position:fixed;z-index:50;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(90vw,420px);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;text-align:center;animation:rise .2s ease}
.dropzone{position:fixed;inset:12px;z-index:60;display:none;place-items:center;border:2px dashed var(--accent);border-radius:32px;background:var(--scrim);color:#fff;font-weight:700;font-size:1.2rem;pointer-events:none}
body.dragging .dropzone{display:grid}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<header class="top" id="hdr"></header>
<main id="content"></main>
<nav class="tabbar" id="bar" aria-label="Gallery"></nav>

<div class="viewer" id="viewer" hidden>
  <div class="stage" id="stage"></div>
  <div class="vtop">
    <button class="glass round" data-act="close" aria-label="Back to library"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="glass vtitle" id="vtitle"></div>
    <span style="width:40px" aria-hidden="true"></span>
  </div>
  <button class="glass round navbtn prev" data-act="prev" aria-label="Previous"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="glass round navbtn next" data-act="next" aria-label="Next"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="vbottom">
    <div class="glass bar" id="vbar"></div>
  </div>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="scrim" data-act="sheetclose"></div>
  <div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div>
</div>

<div class="dropzone">Drop photos to add them</div>
<input type="file" id="file" accept="image/*,video/*,.heic,.heif" multiple hidden>

<script>

  function svg(n, fill, size) {

  var COLL = {

    photos: { name: 'Photos', test: function (i) { return i.kind === 'image'; } },
    videos: { name: 'Videos', test: function (i) { return i.kind === 'video'; } }
  };

  function byId(id) { for (var i = 0; i < S.items.length; i++) if (S.items[i].id === id) return S.items[i]; return null; }

  function visible() {

  function makeSample(n) {

  function showInfo() {

    if (w && h) rows.push(['Dimensions', w + ' × ' + h + (it.kind === 'image' ? ' (' + (w * h / 1e6).toFixed(1) + ' MP)' : '')]);
    if (it.kind === 'video' && it.dur) rows.push(['Length', fmtDur(it.dur)]);
    openSheet('<h3>' + esc(it.name) + '</h3><dl>' + rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' +
      '<p class="note">The date is when the file was last modified, as your phone reports it.</p>' +
      '<button class="row cancel" data-act="sheetclose">Done</button>');
  }

  /* ---------- actions ---------- */
  function toggleFav(ids) {
    var items = ids.map(byId).filter(Boolean);
    var all = items.length && items.every(function (i) { return i.fav; });
    items.forEach(function (i) { i.fav = !all; });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var a = el.dataset.act;
    switch (a) {
      case 'add': closeSheet(); $('#file').click(); break;
      case 'samples': addSamples(); break;
      case 'more': openMenu(); break;
      case 'select': S.selecting = true; S.sel.clear(); render(); break;
      case 'cancel': S.selecting = false; S.sel.clear(); render(); break;
      case 'back': S.coll = null; render(); window.scrollTo(0, 0); break;
      case 'seg': S.seg = el.dataset.k; render(); break;
      case 'tab': S.tab = el.dataset.k; S.coll = null; render(); window.scrollTo(0, 0); break;
      case 'coll': S.coll = el.dataset.k; render(); window.scrollTo(0, 0); break;
      case 'tile':
        var id = +el.dataset.id;
        if (S.selecting) {
          if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id);
          el.classList.toggle('sel', S.sel.has(id));
          renderHeader(); renderBars();
        } else openViewer(id);
        break;
      case 'selfav': toggleFav(Array.from(S.sel)); render(); toast('Favorites updated'); break;
      case 'seldel': confirmRemove(Array.from(S.sel)); break;
      case 'sheetclose': closeSheet(); break;
      case 'confirm': var p = pending; closeSheet(); if (p) p(); break;
      case 'sort': S.sort = S.sort === 'new' ? 'old' : 'new'; closeSheet(); render(); break;
      case 'zoomin': S.zoom -= 1; closeSheet(); render(); break;
      case 'zoomout': S.zoom += 1; closeSheet(); render(); break;
      case 'clearall': confirmRemove(S.items.map(function (i) { return i.id; })); break;
      case 'close': closeViewer(); break;
      case 'prev': go(-1); break;
      case 'next': go(1); break;
      case 'vfav': if (V) { toggleFav([V.list[V.i]]); renderViewerKeep(); } break;
      case 'vdel': if (V) confirmRemove([V.list[V.i]]); break;
      case 'vinfo': showInfo(); break;
    }
  });
  function renderViewerKeep() {
    // refresh bar state without reloading the media
    var it = curItem();
    if (!it) return;
    $('#vbar').innerHTML =
      '<button data-act="vinfo" aria-label="Info">' + svg('info') + '</button>' +
      '<button data-act="vfav" class="' + (it.fav ? 'on' : '') + '" aria-label="' + (it.fav ? 'Remove from favorites' : 'Favorite') + '" aria-pressed="' + it.fav + '">' + svg('heart', it.fav) + '</button>' +
      '<button data-act="vdel" aria-label="Remove">' + svg('trash') + '</button>';
  }

  $('#file').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if (files.length) addFiles(files);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!$('#sheet').hidden) closeSheet();
      else if (V) closeViewer();
      else if (S.selecting) { S.selecting = false; S.sel.clear(); render(); }
    } else if (V && $('#sheet').hidden) {
      if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'ArrowRight') go(1);
    }
  });

  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (!V && $('#sheet').hidden && S.tab !== 'search') renderContent(); }, 150);
  });

  /* drag and drop (desktop) */
  var dc = 0;
  window.addEventListener('dragenter', function (e) {
    if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1) { dc++; document.body.classList.add('dragging'); }
  });
  window.addEventListener('dragleave', function () { dc = Math.max(0, dc - 1); if (!dc) document.body.classList.remove('dragging'); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dc = 0; document.body.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(Array.prototype.slice.call(e.dataTransfer.files));
  });

  window.addEventListener('resize', movePill);
  window.addEventListener('orientationchange', function () { setTimeout(movePill, 120); });

  /* Android back button: close the top layer before leaving the app. */
  window.__ggBack = function () {
    if (!$('#sheet').hidden) { closeSheet(); return true; }
    if (V) { closeViewer(); return true; }
    if (S.selecting) { S.selecting = false; S.sel.clear(); render(); return true; }
    if (S.tab !== 'library' || S.coll) { S.tab = 'library'; S.coll = null; render(); window.scrollTo(0, 0); return true; }
    return false;
  };

  render();
})();
</script>

</body></html>
