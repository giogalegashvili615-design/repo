server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/png png;
        image/svg+xml svg;
        application/vnd.android.package-archive apk;
    }

    # `/` is the gallery itself (mounted from the APK asset dir, one source).
    # The build download page and the signed APK live in glass_gallery/dist.
    location = /download {
        alias /srv/dl/download.html;
    }

    location = /glass_gallery.apk {
        alias /srv/dl/glass_gallery.apk;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
